name: frontend_app
description: HarfScan - Bilingual (Urdu & Arabic) OCR scanner and book digitizer.
publish_to: "none"
version: 2.1.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Native camera / gallery access.
  image_picker: ^1.2.3
  # Multipart HTTP upload / NDJSON streaming from the FastAPI backend.
  http: ^1.6.0
  # PDF export of the compiled book (Arabic-script shaping + RTL).
  pdf: ^3.13.1
  # App documents directory for exported files.
  path_provider: ^2.1.6
  # UI fonts (Poppins) and Urdu Nastaliq / Arabic Naskh fonts for reading.
  # (not 9.x: it pulls in material_ui, whose TextTheme clashes with Flutter's)
  google_fonts: ^6.3.3
  # Hands exported PDF / Word files to Files, Drive, WhatsApp, ...
  share_plus: ^13.3.1
  # Builds the .docx (a ZIP of WordprocessingML XML parts).
  archive: ^4.3.0
  # Remembers settings (server URL, review threshold, ...).
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Embedded in exported PDFs (Arabic + Urdu glyphs). SIL Open Font
    # License, see assets/fonts/OFL.txt.
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    - assets/fonts/NotoNaskhArabic-Bold.ttf
